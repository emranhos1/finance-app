# database
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db_v2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# first-run admin
admin.username=admin
admin.password=admin123

# app
app.name=Daily Finance Management System
# filled from pom.xml at build time
app.version=@project.version@
# repo the login screen checks for new releases
app.update.repo=emranhos1/financei-app