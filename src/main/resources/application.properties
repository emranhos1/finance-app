# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db_v2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Admin User Credentials (for first-run initialization)
admin.username=admin
admin.password=admin123

# Application Settings
app.name=Daily Finance Management System
# filled from pom.xml <version> at build time - bump the version there, not here
app.version=@project.version@
# public GitHub repo whose Releases the login screen checks for updates
app.update.repo=emranhos1/financei-app